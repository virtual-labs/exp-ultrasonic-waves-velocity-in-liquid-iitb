<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>

<body>
   <div style="position:absolute;">

      <div>
         <label for="">Select Fluid</label>
         <Select onchange='set_fluid();' id='fluid-dd' class="form-select">
            <option value="">--Select--</option>
         </Select>
      </div>

      <div>
         <label for="">Select Frequency</label>
         <Select onchange='set_frequency();' disabled id='frequency-dd' class="form-select">
            <option value="">--Select--</option>
         </Select>
      </div>

      <div>
         <label for="">Vernier Calliper</label>
         <input disabled type="range" min='1' max='20' step='1' value="1" id='range' onchange="set_readings();"
            oninput="set_readings();">

         <br>

         <label for="">Main Scale Reading</label>
         <input disabled type='text' class='form-control'
            style="display: inline !important; width: 30%; margin-left: 5%;" id='ms-reading'>

         <br> <br>

         <label for="">Vernier Scale Reading</label>
         <input disabled type="text" class='form-control'
            style="display: inline !important; width: 30%; margin-left: 5%;" id='vs-reading'>


      </div>

   </div>
</body>

</html>
